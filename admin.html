<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ผู้ดูแล | E-Book Thacha</title><link rel="stylesheet" href="style.css"><style>main{max-width:950px;margin:40px auto;padding:20px}.panel{background:#fff;border:1px solid #dbe7e5;border-radius:16px;padding:26px;margin:20px 0}.panel input{width:100%;padding:13px;margin:8px 0 16px;border:1px solid #bdd2d0;border-radius:8px}.panel button{background:#127d83;color:#fff;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;margin:5px}.panel button:disabled{opacity:.5;cursor:wait}.entry{border-top:1px solid #ddd;padding:18px 0;overflow-wrap:anywhere}.muted{color:#657983}.danger{color:#a32626}.entry a{text-decoration:underline;color:#127d83}</style></head><body><header class="top"><a class="brand" href="index.html"><span class="mark">T</span><span>E-Book <b>Thacha</b></span></a><nav><a href="index.html">กลับเว็บไซต์</a></nav></header><main><h1>จัดการหนังสือ (Admin)</h1><p class="muted">เฉพาะผู้ดูแลที่ได้รับอนุญาต หนังสือจะไม่เผยแพร่จนกว่าจะตรวจสอบสิทธิ์</p><section class="panel" id="loginPanel"><h2>เข้าสู่ระบบผู้ดูแล</h2><form id="loginForm"><label>อีเมลผู้ดูแล<input id="email" type="email" autocomplete="username" required value="thacha.l@icdi.cmu.ac.th"></label><label>รหัสผ่าน Supabase Auth<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">เข้าสู่ระบบ</button></form><p id="loginMessage" role="status"></p><p class="muted">ใช้รหัสผ่านของบัญชีใน Supabase Authentication ไม่ใช่รหัสผ่าน GitHub</p></section><section class="panel" id="dashboard" hidden><button id="refresh" type="button">รีเฟรชรายการ</button><button id="logout" type="button">ออกจากระบบ</button><h2>รายการหนังสือที่ส่งมา</h2><p id="message" role="status"></p><div id="entries"></div></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://qhestuqalhhjcccbtano.supabase.co','sb_publishable_1bHeqrj-glSovM-l-GZFgw_UStnvPO_');
const adminId='32a5d7df-ddfc-4d21-9f82-c44d57d10111';
const login=document.getElementById('loginPanel'),dashboard=document.getElementById('dashboard'),message=document.getElementById('message'),entries=document.getElementById('entries');
async function refresh(){entries.replaceChildren();message.textContent='กำลังโหลดรายการ...';const {data,error}=await supabase.from('ebooks').select('id,created_at,title,author,email,rights,evidence,file_path,status').order('created_at',{ascending:false});if(error){message.textContent='อ่านรายการไม่ได้: '+error.message;return}message.textContent='พบ '+data.length+' รายการ';for(const b of data){const item=document.createElement('article');item.className='entry';const title=document.createElement('h3');title.textContent=b.title||'ไม่ระบุชื่อ';item.append(title);for(const [label,value] of [['ผู้เขียน',b.author],['อีเมล',b.email],['สิทธิ์',b.rights],['หลักฐาน',b.evidence],['สถานะ',b.status]]){const p=document.createElement('p');p.textContent=label+': '+(value||'-');item.append(p)}if(b.file_path){const p=document.createElement('p');p.textContent='ไฟล์ถูกเก็บใน Storage ส่วนตัว: '+b.file_path;item.append(p)}if(b.status==='pending'){const warn=document.createElement('label');const check=document.createElement('input');check.type='checkbox';warn.append(check,document.createTextNode(' ตรวจสอบหลักฐานและสิทธิ์เผยแพร่แล้ว'));item.append(warn);for(const [status,label] of [['approved','อนุมัติ'],['rejected','ปฏิเสธ']]){const btn=document.createElement('button');btn.type='button';btn.textContent=label;btn.addEventListener('click',async()=>{if(status==='approved'&&!check.checked){alert('กรุณาตรวจสอบสิทธิ์และทำเครื่องหมายก่อนอนุมัติ');return}if(!confirm('ยืนยันการ'+label+'หนังสือ: '+b.title+' ?'))return;btn.disabled=true;const {error}=await supabase.from('ebooks').update({status}).eq('id',b.id).eq('status','pending');if(error){alert('ดำเนินการไม่สำเร็จ: '+error.message);btn.disabled=false}else await refresh()});item.append(btn)}}entries.append(item)}}
async function checkSession(){const {data:{user}}=await supabase.auth.getUser();const isAdmin=user?.id===adminId;login.hidden=isAdmin;dashboard.hidden=!isAdmin;if(isAdmin)await refresh();else if(user){document.getElementById('loginMessage').textContent='บัญชีนี้ไม่มีสิทธิ์ผู้ดูแล';await supabase.auth.signOut()}}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await supabase.auth.signInWithPassword({email,password});document.getElementById('loginMessage').textContent=error?'เข้าสู่ระบบไม่ได้: '+error.message:'';if(!error)await checkSession()});
document.getElementById('refresh').addEventListener('click',refresh);document.getElementById('logout').addEventListener('click',async()=>{await supabase.auth.signOut();await checkSession()});checkSession();
</script></body></html>
